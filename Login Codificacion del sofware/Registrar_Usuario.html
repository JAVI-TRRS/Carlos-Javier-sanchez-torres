<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crear cuenta</title>
  <link rel="stylesheet" href="style.css" />
  <script src="registrar_Usuario.js"></script>

</head>
<body>

  <main class="page">
    <section class="register-card">
      
      <h1 class="brand">Crear cuenta</h1>
      <p class="subtitle">Regístrate para acceder a tu panel y estar pendientes de las Novedades.</p>

      <form class="register-form" action="#" method="post" novalidate>

        <!-- Nombre -->
        <div class="field">
          <label for="nombre"> Ingresa tu Nombre completo</label>
          <input id="nombre" type="text" name="nombre" placeholder="Tu nombre" required />
        </div>

        <!-- Correo -->
        <div class="field">
          <label for="correo">Correo electrónico</label>
          <input id="correo" type="email" name="correo" placeholder="tucorreo@ejemplo.com" required />
        </div>

        <!-- Contraseña -->
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" type="password" name="password" placeholder="••••••••" required />
        </div>

        <!-- Confirmar Contraseña -->
        <div class="field">
          <label for="password2">Confirmar contraseña</label>
          <input id="password2" type="password" name="password2" placeholder="••••••••" required />
        </div>

        <button class="btn" type="submit">Registrarme</button>

        <p class="login-link">
          ¿Ya tienes una cuenta? <a href="index.html">Inicia sesión</a>
        </p>
      </form>
    </section>

    <aside class="info-panel">
      <div class="info-content">
        <h2>Únete ahora</h2>
        <p>Crea tu cuenta y empieza a administrar tus eventos de manera sencilla.</p>
      </div>
    </aside>

  </main>

</body>
</html>
