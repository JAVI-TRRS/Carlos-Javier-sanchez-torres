<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recuperar contraseña</title>
  <link rel="stylesheet" href="style.css" />
  <script src="Olvidaste_Contraseña.js"></script>

</head>
<body>

  <main class="page">
    <section class="recover-card">
      <h1 class="brand">Recuperar contraseña</h1>
      <p class="subtitle">
        Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.
      </p>

      <form class="recover-form" action="#" method="post" novalidate>
        
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" name="email" placeholder="tucorreo@ejemplo.com" required />
        </div>

        <button class="btn" type="submit">Enviar enlace</button>

        <a href="index.html" class="back">Volver al inicio de sesión</a>

      </form>
    </section>

    <aside class="info-panel">
      <div class="info-content">
        <h2>¿Olvidaste tu contraseña?</h2>
        <p>No te preocupes, te ayudaremos a recuperarla de forma segura.</p>
      </div>
    </aside>
  </main>

</body>
</html>
